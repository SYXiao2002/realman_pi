# Run from repository root; inference is opt-in and has no ROS or robot access.
# The FoundationPose checkout provides the build context and read-only assets.
name: realman-pose6d
services:
  pose6d_server:
    image: realman-pose6d-server:local
    build:
      context: .
      dockerfile: config/docker/pose6d-server.Dockerfile
      additional_contexts:
        foundation_reference: ${POSE6D_REFERENCE_REPO:-../FoundationPose}
        nvdiffrast_source: ${POSE6D_NVDIFFRAST_SOURCE:-https://github.com/NVlabs/nvdiffrast.git#253ac4fcea7de5f396371124af597e6cc957bfae}
      args:
        POSE6D_BASE_IMAGE: ${POSE6D_BASE_IMAGE:-docker.m.daocloud.io/pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel@sha256:0cf3402e946b7c384ba943ee05c90b4c5a4a05227923921f2b0918c011cfaf56}
        POSE6D_USE_PREINSTALLED_PYTORCH3D: ${POSE6D_USE_PREINSTALLED_PYTORCH3D:-0}
    ports:
      - '${POSE6D_BIND_HOST:-127.0.0.1}:${POSE6D_WS_PORT:-8092}:8092'
    volumes:
      - ${POSE6D_WEIGHTS_DIR:-../FoundationPose/weights}:/opt/pose6d/reference/weights:ro
      - ${POSE6D_MESH_DIR:-../FoundationPose/demo_data/eu-plug/mesh_eu-plug}:/models/eu_plug:ro
    read_only: true
    tmpfs:
      - /tmp:size=1g
    stop_grace_period: 65s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
