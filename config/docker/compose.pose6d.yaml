# GPU inference services for single-frame 6D pose. They share the PyTorch/CUDA
# base used by FoundationPose and are started only by the unified rm65 entry.
services:
  # Build once per dependency/CUDA change. Keeping this image tagged protects
  # its expensive Python/CUDA layers from BuildKit cache pruning.
  pose6d_runtime_base:
    image: ${POSE6D_RUNTIME_IMAGE:-realman-pose6d-runtime:local}
    profiles: [build-base]
    build:
      context: ${POSE6D_REFERENCE_REPO:-../FoundationPose}
      dockerfile: docker/pose6d-server.Dockerfile
      target: pose6d_runtime_base
      additional_contexts:
        nvdiffrast_source: ${POSE6D_NVDIFFRAST_SOURCE:-https://github.com/NVlabs/nvdiffrast.git#253ac4fcea7de5f396371124af597e6cc957bfae}
      args:
        POSE6D_BASE_IMAGE: ${POSE6D_BASE_IMAGE:-nvcr.io/nvidian/bundlesdf@sha256:534a24c4fb89c89ba3aefbbaef97dce9b693656e27f46bf55ebb85e45c2842dd}
        POSE6D_RUNTIME_FINGERPRINT: ${POSE6D_RUNTIME_FINGERPRINT:-unset}
        POSE6D_USE_PREINSTALLED_PYTORCH3D: ${POSE6D_USE_PREINSTALLED_PYTORCH3D:-1}

  pose6d_server:
    user: '${POSE6D_UID:-1000}:${POSE6D_GID:-1000}'
    image: realman-pose6d-server:local
    build:
      context: ${POSE6D_REFERENCE_REPO:-../FoundationPose}
      dockerfile: docker/pose6d-server.Dockerfile
      target: pose6d_server
      additional_contexts:
        nvdiffrast_source: ${POSE6D_NVDIFFRAST_SOURCE:-https://github.com/NVlabs/nvdiffrast.git#253ac4fcea7de5f396371124af597e6cc957bfae}
      args:
        POSE6D_BASE_IMAGE: ${POSE6D_BASE_IMAGE:-nvcr.io/nvidian/bundlesdf@sha256:534a24c4fb89c89ba3aefbbaef97dce9b693656e27f46bf55ebb85e45c2842dd}
        POSE6D_RUNTIME_IMAGE: ${POSE6D_RUNTIME_IMAGE:-realman-pose6d-runtime:local}
        POSE6D_USE_PREINSTALLED_PYTORCH3D: ${POSE6D_USE_PREINSTALLED_PYTORCH3D:-1}
    command:
      - --host
      - 0.0.0.0
      - --model
      - eu_plug=/models/eu_plug/TexturedMeshSimplified.obj
      - --model
      - eu_plug_1124=/models/eu_plug_1124/eu-plug-1124mtl.obj
    ports:
      - '${POSE6D_BIND_HOST:-127.0.0.1}:${POSE6D_WS_PORT:-8092}:8092'
      - '${POSE6D_HISTORY_BIND_HOST:-127.0.0.1}:${POSE6D_HISTORY_HTTP_PORT:-8095}:8095'
    volumes:
      - ${POSE6D_HISTORY_DIR:-../FoundationPose/data/pose_history}:/data/pose_history:rw
      - ${POSE6D_WEIGHTS_DIR:-../FoundationPose/weights}:/opt/pose6d/reference/weights:ro
      - ${POSE6D_MESH_DIR:-../FoundationPose/demo_data/eu-plug/mesh_eu-plug}:/models/eu_plug:ro
      - ${POSE6D_1124_MESH_DIR:-../FoundationPose/demo_data/eu-plug-1124/mesh}:/models/eu_plug_1124:ro
    read_only: true
    tmpfs: [/tmp:size=1g]
    stop_grace_period: 65s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  pose6d_yolo:
    image: realman-pose6d-yolo:local
    build:
      context: ../realman_pose_vision
      dockerfile: yolo/Dockerfile
      args:
        POSE6D_VISION_BASE_IMAGE: ${POSE6D_BASE_IMAGE:-nvcr.io/nvidian/bundlesdf@sha256:534a24c4fb89c89ba3aefbbaef97dce9b693656e27f46bf55ebb85e45c2842dd}
    ports:
      - '${POSE6D_YOLO_BIND_HOST:-127.0.0.1}:${POSE6D_YOLO_WS_PORT:-8093}:8093'
    volumes:
      - ../realman_pose_vision/assets/yolov8n.pt:/models/yolov8n.pt:ro
      - ./config/vision/pose6d_yolo.yaml:/etc/pose6d/pose6d_yolo.yaml:ro
    read_only: true
    tmpfs: [/tmp:size=1g]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python3, -m, common.healthcheck, --port, '8093', --service, pose6d_yolo]
      interval: 10s
      timeout: 4s
      retries: 18
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  pose6d_sam2:
    image: realman-pose6d-sam2:local
    build:
      context: ../realman_pose_vision
      dockerfile: sam2/Dockerfile
      additional_contexts:
        sam2_source: ${POSE6D_SAM2_REPO:-../sam2}
      args:
        POSE6D_VISION_BASE_IMAGE: ${POSE6D_BASE_IMAGE:-nvcr.io/nvidian/bundlesdf@sha256:534a24c4fb89c89ba3aefbbaef97dce9b693656e27f46bf55ebb85e45c2842dd}
    ports:
      - '${POSE6D_SAM2_BIND_HOST:-127.0.0.1}:${POSE6D_SAM2_WS_PORT:-8094}:8094'
    volumes:
      - ${POSE6D_SAM2_CHECKPOINT:-../sam2/checkpoints/sam2.1_hiera_tiny.pt}:/models/sam2.1_hiera_tiny.pt:ro
      - ./config/vision/pose6d_sam2.yaml:/etc/pose6d/pose6d_sam2.yaml:ro
    read_only: true
    tmpfs: [/tmp:size=1g]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python3, -m, common.healthcheck, --port, '8094', --service, pose6d_sam2]
      interval: 10s
      timeout: 4s
      retries: 18
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
