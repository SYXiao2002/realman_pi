# 宿主机直接调用已安装的 orbbec_camera 二进制 ROS 包；无需仓库驱动 overlay。
# cameras 的键就是 ROS namespace，按 serial 绑定硬件，USB 枚举顺序不影响话题。
# 可选 cameras_ros2.local.yaml 深合并覆盖；也可用 RM65_CAMERAS_LOCAL_CONFIG 指定文件。
# 旧 wrist_cameras/global_camera schema 必须迁移，避免旧串号/曝光参数静默生效。
launch:
  # 单位秒；错峰打开设备，避免四台 USB 相机同时初始化。
  stagger_seconds: 2.0

# 直接传给官方 launch 的共享参数，单机可在 cameras.<namespace>.parameters 覆盖。
# 宽高 0 / ANY 使用驱动支持的默认 profile，fps 单位 Hz；换档位前确认设备支持。
# color 模式保留 RGB；enable_depth 可共享设置，也可逐设备覆盖。
# depth 宽高/fps 为 0、格式 ANY 时使用 SDK 默认档位；IR/IMU/点云/跨设备触发保持关闭。
defaults:
  color_width: 0
  color_height: 0
  color_fps: 30
  color_format: ANY
  enable_depth: false
  depth_width: 0
  depth_height: 0
  depth_fps: 0
  depth_format: ANY
  enable_color_auto_exposure: true
  enable_point_cloud: false
  enable_colored_point_cloud: false
  enable_left_ir: false
  enable_right_ir: false
  enable_accel: false
  enable_gyro: false
  # 设备内 RGB-D 同步可逐相机覆盖；先核实设备能力。它不提供 D2C 空间配准。
  enable_frame_sync: false
  trigger_out_enabled: false
  software_trigger_enabled: false
  sync_mode: standalone

cameras:
  camera_global:
    # back GLOBAL CAM：Gemini 335L。
    serial: "CP28563000CK"
    launch_file: gemini_330_series.launch.py
    # 后置全局相机同时发布 RGB 和原始深度，不启用深度对齐或点云。
    parameters: {enable_depth: true}
  camera_global2:
    # front GLOBAL CAM：Gemini 335L。
    serial: "CP28563000CV"
    launch_file: gemini_330_series.launch.py
  camera_right:
    # right WRIST CAM：Gemini 305 使用官方 301 series 启动文件。
    serial: "CV2856D0002E"
    launch_file: gemini_301_series.launch.py
    # 右腕同时发布 RGB 和原始深度；grasp_bridge 使用真实内外参进行软件 D2C。
    # 两腕使用设备内 RGB-D 同步，与离线采集一致；D2C 仍由 bridge 完成一次。
    parameters: {ae_reference_stream: color, enable_depth: true, enable_frame_sync: true}
  camera_left:
    # left WRIST CAM；没有中腕相机，不发布 camera_middle。
    serial: "CV2856D0008H"
    launch_file: gemini_301_series.launch.py
    parameters: {ae_reference_stream: color, enable_depth: true, enable_frame_sync: true}
    # enabled: false 可跳过临时拆除的设备（默认 true），检查也只等待启用设备。
    # parameters: {color_width: 640, color_height: 480, color_fps: 30}
