# Left/right 42D grippers share one physical RS-485 bus (115200, 8N1).
# Their positions are compatibility coordinates, not measured travel: the adapter
# maps opening percentage to fully open/closed while preserving ROS/UI endpoints.
# The middle arm has no gripper; do not require its former Changingtek serial bus.
# Keep gripper writes and arm commands under the driver's same task lease.
# Unavailable admission services reject writes; feedback remains independent.
task_control:
  timeout_sec: 1.0
  arms:
    gripper_left: l
    gripper_right: r
buses:
  - port: /dev/tty_gripper_42d
    protocol: binary_42d
    baudrate: 115200
    timeout: 0.3
    # Two addressed reads with >=100 ms between transactions fit a 5 Hz sweep.
    poll_hz: 5.0
    auto_reconnect: true
    reconnect_interval: 5.0
    binary_threshold: 0.5        # Opening fraction: first target >= threshold opens.
    binary_hysteresis: 0.05      # Close <0.45, open >=0.55; hold in between.
    inter_transaction_s: 0.1     # Shared by reads/writes and both slave addresses.
    grippers:
      - name: gripper_left
        slave_id: 1
        # Keep previous coordinates so overrides, UI and ROS clients stay valid.
        open_position: 20
        close_position: 900
        min_position: 0
        max_position: 900
      - name: gripper_right
        slave_id: 2
        open_position: 50
        close_position: 8500
        min_position: 0
        max_position: 8500
