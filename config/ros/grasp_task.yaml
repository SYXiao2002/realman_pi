# Behavior-tree task controls only. Profile and backend are shared with
# grasp.html through grasp_bridge.yaml; robot geometry stays in grasp_profiles.yaml.
version: 1
# The lease spans gripper preparation, observation/inference, and all grasp
# waypoints. The BT renews it while the task is running.
# Number of complete grasp cycles: -1 keeps repeating until stopped; a positive
# value runs that many successful cycles. Any failed cycle stops the task.
cycles: -1
lease_ttl_sec: 60.0
acquire_timeout_sec: 10.0
motion_timeout_sec: 30.0
plan_timeout_sec: 30.0
# Existing 42D manager waits up to 20 seconds for an endpoint response.
gripper_timeout_sec: 25.0
hold_sec: 1.0
# Task lease keeps renewing while the operator observes the held object.
# Timeout/declined return/cancel never triggers an automatic gripper opening.
confirmation_timeout_sec: 120.0
