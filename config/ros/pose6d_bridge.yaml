# Read-only single-frame service. Camera/calibration identity comes from grasp_profiles.yaml.
profile: right_wrist
ws_uri: ws://127.0.0.1:8092
connect_timeout_sec: 5.0
inference_timeout_sec: 90.0
# Local-only detector and promptable segmentation WebSocket services.
yolo_ws_uri: ws://127.0.0.1:8093
sam2_ws_uri: ws://127.0.0.1:8094
vision_connect_timeout_sec: 5.0
yolo_timeout_sec: 45.0
sam2_timeout_sec: 90.0
yolo_model_sha256: fcc66bc2fa3fb605948704f26535ed6b9fe15cb13286496209b39dd075eac9ef
sam2_model_sha256: 7402e0d864fa82708a20fbd15bc84245c2f26dff0eb43a4b5b93452deb34be69
vision_confidence_threshold: 0.5
vision_max_detections: 16
vision_max_image_pixels: 1000000
vision_max_mask_bytes: 16777216
# Mounted read-only in the optional pose6d_bridge container. A model without
# annotation_file is available for pose inference/review only; suction motion
# remains disabled until its contact regions and normals are annotated.
default_object_id: eu_plug_1124
models:
  eu_plug:
    label: 欧规插头
    mesh_dir: /models/eu_plug
    mesh_file: TexturedMeshSimplified.obj
    annotation_file: eu_plug_grasps.json
    suction_enabled: true
  eu_plug_1124:
    label: 欧规插头 1124
    mesh_dir: /models/eu_plug_1124
    mesh_file: eu-plug-1124mtl.obj
    annotation_file: eu-plug-1124mtl_grasps.json
    # The annotation tool exports the mesh stem as its object ID.
    annotation_object_id: eu-plug-1124mtl
    suction_enabled: true
cloud_stride: 4

# Operator supplied cup diameter; annotation contact-region radii stay separate.
suction:
  cup_diameter_m: 0.010
  body_radius_m: 0.005       # 10 mm cylindrical envelope; enlarge for wider fittings
  body_length_m: 0.010       # contact plane back to flange, along contact -Z

# Low-speed, reviewed single-axis motion. The UI requires explicit review per pose.
motion:
  enabled: true
  tool_name: tcpsuck
  T_contact_tcp:
    xyz_m: [0, 0, 0]         # controller TCP is the suction contact center
    rpy_rad: [0, 0, 0]       # same axes; R = Rz(yaw) Ry(pitch) Rx(roll)
  min_distance_m: -0.01    # allow only 5 mm past the estimated surface
  max_distance_m: 0.1       # includes the configured preparation position
  contact_offset_m: 0.005   # automatic suction advances 5 mm into the estimated surface
  max_step_m: 0.001
  velocity_percent: 10
  prepare_distance_m: 0.02
  second_prepare_distance_m: 0.01
  lift_height_m: 0.1
  # Wait for post-lift IO updates; require two samples and allow vacuum to build.
  vacuum_confirm_timeout_sec: 1.5
  # Initial posture for both the transfer before placing and the final return.
  # null reads the posture saved by the controller web pendant. To override it:
  home_joint_degrees: [9.760, 11.964, 106.229, -1.437, 54.787, 10.141]
  # home_joint_degrees: null
  # After lifting and confirming suction: MOVEJ home, confirm, MOVEJ place,
  # confirm, switch suction off (0 V), then MOVEJ home and confirm completion.
  # Transit/placement bypass grasp workspace bounds.
  place_joint_degrees: [95.045, 11.965, 106.228, -1.437, 54.787, 10.14]
  # Each segment has its own SDK speed percentage (integer 1..100).
  prepare_velocity_percent: 100
  approach_velocity_percent: 50
  contact_velocity_percent: 10
  lift_velocity_percent: 100
  home_velocity_percent: 10
  place_velocity_percent: 100
  return_velocity_percent: 100
  # Per-segment motion timeout in seconds; allow more time for slower moves.
  timeout_sec: 10
  position_tolerance_m: 0.002
  angular_tolerance_rad: 0.035
  joint_tolerance_deg: 0.25
  workspace_m:  [[-0.498187, -0.252385, -0.15], [0.167103, 0.213348, 0.359098]]
  cartesian_sample_step_m: 0.005
  angular_sample_step_rad: 0.05
  collision_margin_m: 0.003
  # The workspace precheck samples a Cartesian line, not the controller's MOVEJ_P joint path.
  # MOVEJ_P has no obstacle-path prediction here; review its full physical path before confirmation.
  allow_partial_scene: true
  lease_ttl_sec: 15.0
  # Read-only TCP/FK/initial-posture queries may wait longer after a motion.
  # Motion submission, tool power, stop and lease operations use service_timeout_sec.
  read_service_timeout_sec: 8.0
  service_timeout_sec: 3.0
