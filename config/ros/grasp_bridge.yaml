# Planning-only bridge. dry_run enables read-only RGB-D/TF subscriptions and
# policy evaluation, but never creates IK or task-lease clients. Set false only
# after the profile is fully verified to enable restricted IK planning; this
# bridge never executes robot or gripper commands.
version: 1
dry_run: true
profile: right_wrist
ws_uri: ws://127.0.0.1:8091
backend: geometry
# Maximum elapsed seconds; independently bound capture, inference and each IK.
capture_timeout_sec: 5.0
inference_timeout_sec: 20.0
connect_timeout_sec: 3.0
ik_timeout_sec: 2.0
# Read-only driver STATUS validates a supplied task lease around planning.
lease_status_timeout_sec: 1.0
# Device sync is optional; timestamps are always checked. Stop before capture.
maximum_pair_skew_sec: 0.05
maximum_capture_age_sec: 0.75
settle_sec: 0.5
maximum_joint_velocity_rad_sec: 0.01
maximum_joint_state_age_sec: 0.25
maximum_view_tilt_rad: 0.35
# Captured pose must remain valid when inference completes, and before execution.
maximum_translation_drift_m: 0.002
maximum_rotation_drift_rad: 0.02
plan_validity_sec: 30.0
# Restrict IK branch changes at each straight-line corridor sample.
maximum_ik_step_degrees: 15.0
cartesian_sample_step_m: 0.01
max_candidates: 8
# Expected server model is explicit; null prevents live plans until pinned.
expected_model_id: null
