# Metric top-surface/PCA policy adapted from reference grasp_policy.yaml.
# The common frame is constructed directly: no legacy yaw/wrist compensation.
# Geometry remains limited to the validated near-topdown observation envelope.
default:
  max_view_tilt_deg: 25.0
  min_depth_m: 0.08
  max_depth_m: 2.0
  min_object_points: 80
  top_slice_percentile: 20.0
  top_band_m: 0.005
  yaw_candidates_deg: [0, 30, 60, 90, 120, 150]
  min_grasp_width_m: 0.008
  max_grasp_width_m: 0.070
  # Visible contact length along the fingers, independent of image resolution.
  contact_half_span_m: 0.010
class_aliases:
  net_cable: [line, net_cable]
  line: [line, net_cable]
  eu: [eu, first_plug]
  uk: [uk, second_plug]
classes:
  adapter:
    min_grasp_width_m: 0.012
  router:
    min_grasp_width_m: 0.015
    max_grasp_width_m: 0.060
  eu:
    min_grasp_width_m: 0.010
    max_grasp_width_m: 0.060
  uk:
    min_grasp_width_m: 0.012
    max_grasp_width_m: 0.050
  net_cable:
    min_grasp_width_m: 0.006
    max_grasp_width_m: 0.025
    contact_half_span_m: 0.005
