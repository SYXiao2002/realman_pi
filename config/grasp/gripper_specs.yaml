# Geometry shared by Web evaluation and behavior-tree planning. Operators are
# responsible for keeping these dimensions aligned with the installed gripper.
grippers:
  binary_42d_right:
    id: binary_42d_right_unmeasured
    min_opening_m: 0
    max_opening_m: 0.05
    finger_depth_m: 0.05
    finger_thickness_m: 0.015
    # Y-direction (into-page) width of each finger pad; left finger is +X, right is -X.
    # Visualization only: not used by the clearance/opening filter. Palm body is not modelled.
    finger_width_m: 0.03
    clearance_m: 0.005
  binary_42d_left:
    id: binary_42d_left_unmeasured
    min_opening_m: 0
    max_opening_m: 0.05
    finger_depth_m: 0.05
    finger_thickness_m: 0.01
    # Y-direction (into-page) width of each finger pad; left finger is +X, right is -X.
    # Visualization only: not used by the clearance/opening filter. Palm body is not modelled.
    finger_width_m: 0.03
    clearance_m: 0.005
